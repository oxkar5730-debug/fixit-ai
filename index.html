<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixia</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            padding: 15px 20px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1a1a1a;
            border-bottom: 1px solid #333;
        }
        header span.version {
            font-size: 12px;
            background-color: #f4a261;
            color: #1a1a1a;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
        }
        .view-container {
            flex: 1;
            display: none;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            box-sizing: border-box;
        }
        .view-container.active {
            display: flex;
        }
        /* Vista Cámara / Inicio (Izquierda) */
        .camera-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            text-align: center;
            flex: 1;
        }
        .camera-btn {
            background-color: #f4a261;
            color: #1a1a1a;
            border: none;
            border-radius: 12px;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        #preview-img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 8px;
            display: none;
        }
        /* Vista Chat (Centro) */
        .chat-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            padding-bottom: 20px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
        }
        .message.incoming {
            background-color: #2a2a2a;
            align-self: flex-start;
            border: 1px solid #333;
        }
        .message.outgoing {
            background-color: #f4a261;
            color: #1a1a1a;
            align-self: flex-end;
            font-weight: 500;
        }
        .message.error {
            background-color: #5c2c2c;
            color: #ffcccc;
            align-self: stretch;
            border: 1px solid #8b0000;
        }
        .chat-input-area {
            display: flex;
            gap: 10px;
            padding-top: 10px;
            background-color: #1a1a1a;
        }
        .chat-input-area input {
            flex: 1;
            background-color: #2a2a2a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-size: 14px;
            outline: none;
        }
        .chat-input-area button {
            background-color: #f4a261;
            color: #1a1a1a;
            border: none;
            border-radius: 8px;
            padding: 0 20px;
            font-weight: bold;
            cursor: pointer;
        }
        /* Vista Amazon (Derecha) */
        .amazon-view {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .amazon-search-box {
            display: flex;
            gap: 10px;
        }
        .amazon-search-box input {
            flex: 1;
            background-color: #2a2a2a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-size: 14px;
            outline: none;
        }
        .amazon-search-box button {
            background-color: #ff9900;
            color: #1a1a1a;
            border: none;
            border-radius: 8px;
            padding: 0 20px;
            font-weight: bold;
            cursor: pointer;
        }
        /* Barra de Navegación Inferior */
        nav.bottom-bar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: #1a1a1a;
            border-top: 1px solid #333;
            height: 60px;
            user-select: none;
            -webkit-user-select: none;
        }
        .nav-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
            outline: none;
            padding: 10px;
        }
        .nav-btn.active {
            color: #f4a261;
        }
    </style>
</head>
<body>

    <header>
        Fixia
        <span class="version">v1.4.0</span>
    </header>

    <!-- Vista 1: Cámara / Inicio (Izquierda) -->
    <div id="vista-inicio" class="view-container">
        <div class="camera-view">
            <h2>Capturar Avería</h2>
            <p>Haz una foto directamente con la cámara de tu móvil para analizarla en el chat.</p>
            <input type="file" id="camera-input" accept="image/*" capture="environment" style="display: none;">
            <button class="camera-btn" onclick="document.getElementById('camera-input').click()">📷 Hacer Foto</button>
            <img id="preview-img" alt="Vista previa">
        </div>
    </div>

    <!-- Vista 2: Chat (Centro) -->
    <div id="vista-chat" class="view-container active">
        <div class="chat-box" id="chat-box">
            <div class="message incoming">¡Hola! Pregúntame lo que necesites sobre reparaciones o bricolaje.</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Escribe tu consulta...">
            <button id="send-btn">Enviar</button>
        </div>
    </div>

    <!-- Vista 3: Amazon (Derecha) -->
    <div id="vista-amazon" class="view-container">
        <h2>Recomendaciones de Amazon</h2>
        <p>Busca herramientas, recambios o materiales directamente en Amazon:</p>
        <div class="amazon-search-box">
            <input type="text" id="amazon-query" placeholder="Buscar herramienta o material...">
            <button id="amazon-search-btn">Buscar</button>
        </div>
    </div>

    <!-- Barra de Navegación: [Cámara] [Chat] [Amazon] -->
    <nav class="bottom-bar">
        <button class="nav-btn" id="btn-inicio" data-target="vista-inicio">📷</button>
        <button class="nav-btn active" id="btn-chat" data-target="vista-chat">💬</button>
        <button class="nav-btn" id="btn-amazon" data-target="vista-amazon">🛒</button>
    </nav>

    <script>
        const navButtons = document.querySelectorAll('.nav-btn');
        const views = document.querySelectorAll('.view-container');

        navButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                navButtons.forEach(b => b.classList.remove('active'));
                views.forEach(v => v.classList.remove('active'));

                btn.classList.add('active');
                const targetId = btn.getAttribute('data-target');
                document.getElementById(targetId).classList.add('active');
            });
        });

        let base64Image = null;
        const cameraInput = document.getElementById('camera-input');
        const previewImg = document.getElementById('preview-img');

        cameraInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (uploadEvent) => {
                    previewImg.src = uploadEvent.target.result;
                    previewImg.style.display = 'block';
                    base64Image = uploadEvent.target.result.split(',')[1];
                };
                reader.readAsDataURL(file);
            }
        });

        const amazonBtn = document.getElementById('amazon-search-btn');
        const amazonQuery = document.getElementById('amazon-query');

        amazonBtn.addEventListener('click', () => {
            const query = amazonQuery.value.trim();
            if (query) {
                const url = `https://www.amazon.es/s?k=${encodeURIComponent(query)}`;
                window.open(url, '_blank');
            }
        });

        amazonQuery.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                amazonBtn.click();
            }
        });

        const sendBtn = document.getElementById('send-btn');
        const userInput = document.getElementById('user-input');
        const chatBox = document.getElementById('chat-box');

        async function enviarMensaje() {
            const texto = userInput.value.trim();
            if (!texto && !base64Image) return;

            const userMsg = document.createElement('div');
            userMsg.className = 'message outgoing';
            userMsg.textContent = texto || "[Imagen adjunta]";
            chatBox.appendChild(userMsg);
            
            userInput.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            const currentImage = base64Image;
            base64Image = null;
            if (previewImg) previewImg.style.display = 'none';

            try {
                const response = await fetch('/api/analizar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mensaje: texto || "Analiza esta imagen", imagen: currentImage })
                });

                const data = await response.json();

                const aiMsg = document.createElement('div');
                aiMsg.className = 'message incoming';
                if (response.ok) {
                    aiMsg.textContent = data.respuesta;
                } else {
                    aiMsg.className = 'message error';
                    aiMsg.textContent = "Error del servidor: " + (data.error || "Desconocido");
                }
                chatBox.appendChild(aiMsg);
                chatBox.scrollTop = chatBox.scrollHeight;

            } catch (err) {
                const errorMsg = document.createElement('div');
                errorMsg.className = 'message error';
                errorMsg.textContent = "Error de conexión con el servidor.";
                chatBox.appendChild(errorMsg);
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        sendBtn.addEventListener('click', enviarMensaje);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') enviarMensaje();
        });
    </script>
</body>
</html>
