<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixia v1.4.0</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 500px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background-color: #121212;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #f59e0b;
        }

        .version-badge {
            background-color: #332712;
            color: #f59e0b;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background-color: #1a1a1a;
            margin: 0 12px;
            border-radius: 16px;
            border: 1px solid #2a2a2a;
        }

        .message {
            max-width: 85%;
            padding: 14px 16px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.bot {
            background-color: #2d2d2d;
            color: #e5e5e5;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.user {
            background-color: #f59e0b;
            color: #000000;
            font-weight: 500;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.error {
            background-color: #3b1419;
            color: #f87171;
            border: 1px solid #7f1d1d;
            align-self: flex-start;
            font-size: 14px;
        }

        .input-container {
            padding: 16px;
            display: flex;
            gap: 10px;
            background-color: #121212;
        }

        input[type="text"] {
            flex: 1;
            background-color: #1e1e1e;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 14px 16px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: #888888;
        }

        button.send-btn {
            background-color: #f59e0b;
            color: #000000;
            border: none;
            border-radius: 12px;
            padding: 0 20px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
        }

        nav.bottom-bar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 0;
            background-color: #121212;
            border-top: 1px solid #222222;
        }

        .nav-item {
            color: #888888;
            font-size: 20px;
            cursor: pointer;
        }

        .nav-item.active {
            color: #f59e0b;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Fixia</div>
        <div class="version-badge">v1.4.0</div>
    </header>

    <div class="chat-container" id="chat">
        <div class="message bot">
            ¡Hola! Pregúntame lo que necesites sobre reparaciones o bricolaje.
        </div>
    </div>

    <div class="input-container">
        <input type="text" id="userInput" placeholder="Escribe tu consulta..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="enviarMensaje()">Enviar</button>
    </div>

    <nav class="bottom-bar">
        <div class="nav-item active">✦</div>
        <div class="nav-item">⌂</div>
        <div class="nav-item">➔</div>
    </nav>

    <script>
        async function enviarMensaje() {
            const input = document.getElementById('userInput');
            const chat = document.getElementById('chat');
            const texto = input.value.trim();

            if (!texto) return;

            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = texto;
            chat.appendChild(userMsg);

            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            try {
                const response = await fetch('/api/analizar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mensaje: texto })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Error en el servidor');
                }

                const botMsg = document.createElement('div');
                botMsg.className = 'message bot';
                botMsg.textContent = data.respuesta;
                chat.appendChild(botMsg);

            } catch (err) {
                const errorMsg = document.createElement('div');
                errorMsg.className = 'message error';
                errorMsg.textContent = `Error del servidor: ${err.message}`;
                chat.appendChild(errorMsg);
            }

            chat.scrollTop = chat.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                enviarMensaje();
            }
        }
    </script>
</body>
</html>
